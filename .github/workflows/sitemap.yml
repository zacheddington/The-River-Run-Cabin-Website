# Keeps sitemap.xml's <lastmod> dates accurate. After each push to main it
# rebuilds the sitemap from git history and commits it only if a date changed.
# GitHub Pages then redeploys as usual.
name: Update sitemap

on:
  push:
    branches: [main]
    paths-ignore: [sitemap.xml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so each page's last change is known

      - run: node scripts/build-sitemap.mjs

      - name: Commit if any date changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sitemap dates" -- sitemap.xml
          git push
